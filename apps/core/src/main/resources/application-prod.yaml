spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USER}
    password: ${DATABASE_PASSWORD}
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${ZITADEL_CLIENT_ID}
            client-secret: ${ZITADEL_CLIENT_SECRET}
          apple:
            client-id: ${ZITADEL_CLIENT_ID}
            client-secret: ${ZITADEL_CLIENT_SECRET}
          facebook:
            client-id: ${ZITADEL_CLIENT_ID}
            client-secret: ${ZITADEL_CLIENT_SECRET}
        provider:
          zitadel:
            authorization-uri: ${ZITADEL_AUTHORIZATION_URI}
            token-uri: ${ZITADEL_TOKEN_URI}
            user-info-uri: ${ZITADEL_USERINFO_URI}
            jwk-set-uri: ${ZITADEL_JWK_SET_URI}

platform:
  offline-access:
    signing-key-version: ${OFFLINE_AUTHORIZATION_KMS_KEY_VERSION}
  provider:
    google-cloud-project: ${GOOGLE_CLOUD_PROJECT}
  generation:
    working-bucket: ${WORKING_BUCKET}
    final-bucket: ${FINALIZED_BUCKET}
    open-ai-api-key: ${OPENAI_API_KEY:}
  demonstration-subscription:
    webhook-secret: ${STRIPE_WEBHOOK_SECRET}
    monthly-price-id: ${STRIPE_DEMONSTRATION_MONTHLY_PRICE_ID}
    monthly-grant-characters: ${STRIPE_DEMONSTRATION_MONTHLY_GRANT_CHARACTERS}
    projector-enabled: ${STRIPE_PROJECTOR_ENABLED:true}
  narration:
    working-bucket: ${WORKING_BUCKET}
  admission:
    upload-token-secret: ${UPLOAD_TOKEN_SECRET}
    cloud-project-id: ${GOOGLE_CLOUD_PROJECT}
    working-bucket: ${WORKING_BUCKET}
    work-topic: ${WORK_TOPIC}
    push-audience: ${PUBSUB_PUSH_AUDIENCE}
    push-service-account: ${PUBSUB_PUSH_SERVICE_ACCOUNT}
  build:
    version: ${BUILD_VERSION}
    revision: ${BUILD_REVISION}
  entitlement:
    free-grant-characters: ${FREE_GRANT_CHARACTERS}
    free-grant-validity: ${FREE_GRANT_VALIDITY}
    per-conversion-character-ceiling: ${PER_CONVERSION_CHARACTER_CEILING}
    per-conversion-spend-ceiling-micros: ${PER_CONVERSION_SPEND_CEILING_MICROS}
    per-listener-spend-ceiling-micros: ${PER_LISTENER_SPEND_CEILING_MICROS}
    provider-spend-ceiling-micros: ${PROVIDER_SPEND_CEILING_MICROS}
    global-spend-ceiling-micros: ${GLOBAL_SPEND_CEILING_MICROS}
    per-listener-concurrency: ${PER_LISTENER_CONCURRENCY}
    global-concurrency: ${GLOBAL_CONCURRENCY}
  identity:
    allowed-origin: ${APPLICATION_ORIGIN}
    broker-issuer: ${ZITADEL_ISSUER}
    recovery-uri: ${ZITADEL_RECOVERY_URI}
    broker-provider-ids:
      google: ${ZITADEL_GOOGLE_IDP_ID}
      apple: ${ZITADEL_APPLE_IDP_ID}
      facebook: ${ZITADEL_FACEBOOK_IDP_ID}
    operator-listener-ids: ${OPERATOR_LISTENER_IDS}
    support-staff-listener-ids: ${SUPPORT_STAFF_LISTENER_IDS:}
    reliability-staff-listener-ids: ${RELIABILITY_STAFF_LISTENER_IDS:}
    entitlement-staff-listener-ids: ${ENTITLEMENT_STAFF_LISTENER_IDS:}
    voice-staff-listener-ids: ${VOICE_STAFF_LISTENER_IDS:}
    incident-responder-listener-ids: ${INCIDENT_RESPONDER_LISTENER_IDS:}
    security-reviewer-listener-ids: ${SECURITY_REVIEWER_LISTENER_IDS:}
  trust-operations:
    delegated-access-maximum-duration: ${DELEGATED_ACCESS_MAXIMUM_DURATION:24h}
    emergency-access-maximum-duration: ${EMERGENCY_ACCESS_MAXIMUM_DURATION:30m}
    emergency-review-deadline: ${EMERGENCY_REVIEW_DEADLINE:24h}
    fresh-mfa-maximum-age: ${EMERGENCY_FRESH_MFA_MAXIMUM_AGE:5m}
  retention:
    tombstone-key: ${RETENTION_TOMBSTONE_KEY}
    tombstone-registry-bucket: ${RETENTION_TOMBSTONE_BUCKET}

management:
  tracing:
    enabled: ${TRACING_ENABLED:false}
