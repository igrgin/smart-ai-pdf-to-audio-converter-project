spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USER}
    password: ${DATABASE_PASSWORD}
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${ZITADEL_CLIENT_ID}
            client-secret: ${ZITADEL_CLIENT_SECRET}
          apple:
            client-id: ${ZITADEL_CLIENT_ID}
            client-secret: ${ZITADEL_CLIENT_SECRET}
          facebook:
            client-id: ${ZITADEL_CLIENT_ID}
            client-secret: ${ZITADEL_CLIENT_SECRET}
        provider:
          zitadel:
            authorization-uri: ${ZITADEL_AUTHORIZATION_URI}
            token-uri: ${ZITADEL_TOKEN_URI}
            user-info-uri: ${ZITADEL_USERINFO_URI}
            jwk-set-uri: ${ZITADEL_JWK_SET_URI}

platform:
  build:
    version: ${BUILD_VERSION}
    revision: ${BUILD_REVISION}
  identity:
    allowed-origin: ${APPLICATION_ORIGIN}
    broker-issuer: ${ZITADEL_ISSUER}
    recovery-uri: ${ZITADEL_RECOVERY_URI}
    broker-provider-ids:
      google: ${ZITADEL_GOOGLE_IDP_ID}
      apple: ${ZITADEL_APPLE_IDP_ID}
      facebook: ${ZITADEL_FACEBOOK_IDP_ID}

management:
  tracing:
    enabled: ${TRACING_ENABLED:false}
