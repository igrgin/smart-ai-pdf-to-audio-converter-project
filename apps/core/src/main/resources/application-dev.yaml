spring:
  datasource:
    hikari:
      maximum-pool-size: 2

server:
  servlet:
    session:
      cookie:
        secure: false

platform:
  generation:
    open-ai-api-key: ${OPENAI_API_KEY:}
  identity:
    secure-session-cookie: false

management:
  tracing:
    sampling:
      probability: 1.0
