spring:
  application:
    name: audiobook-platform-core
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/audiobook}
    username: ${DATABASE_USER:audiobook}
    password: ${DATABASE_PASSWORD:audiobook-local}
    hikari:
      maximum-pool-size: ${DATABASE_POOL_SIZE:4}
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework

platform:
  build:
    version: ${BUILD_VERSION:dev}
    revision: ${BUILD_REVISION:local}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  tracing:
    sampling:
      probability: ${TRACING_SAMPLE_RATE:0.1}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}

logging:
  pattern:
    level: "%5p trace_id=%X{traceId:-} span_id=%X{spanId:-}"
