spring:
  application:
    name: audiobook-platform-core
  session:
    timeout: ${SESSION_IDLE_TIMEOUT:15m}
    jdbc:
      initialize-schema: never
      cleanup-cron: "0 * * * * *"
  security:
    oauth2:
      client:
        registration:
          google:
            provider: zitadel
            client-id: ${ZITADEL_CLIENT_ID:folio-local}
            client-secret: ${ZITADEL_CLIENT_SECRET:local-development-only}
            client-authentication-method: client_secret_basic
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: openid,profile,email
            client-name: Google through ZITADEL
          apple:
            provider: zitadel
            client-id: ${ZITADEL_CLIENT_ID:folio-local}
            client-secret: ${ZITADEL_CLIENT_SECRET:local-development-only}
            client-authentication-method: client_secret_basic
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: openid,profile,email
            client-name: Apple through ZITADEL
          facebook:
            provider: zitadel
            client-id: ${ZITADEL_CLIENT_ID:folio-local}
            client-secret: ${ZITADEL_CLIENT_SECRET:local-development-only}
            client-authentication-method: client_secret_basic
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: openid,profile,email
            client-name: Facebook through ZITADEL
        provider:
          zitadel:
            authorization-uri: ${ZITADEL_AUTHORIZATION_URI:http://wiremock:8080/oauth/v2/authorize}
            token-uri: ${ZITADEL_TOKEN_URI:http://wiremock:8080/oauth/v2/token}
            user-info-uri: ${ZITADEL_USERINFO_URI:http://wiremock:8080/oidc/v1/userinfo}
            jwk-set-uri: ${ZITADEL_JWK_SET_URI:http://wiremock:8080/oauth/v2/keys}
            user-name-attribute: sub
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/audiobook}
    username: ${DATABASE_USER:audiobook}
    password: ${DATABASE_PASSWORD:audiobook-local}
    hikari:
      maximum-pool-size: ${DATABASE_POOL_SIZE:4}
      connection-init-sql: SET search_path TO admission, workflow, public
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    default-schema: public
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        name: FOLIO_SESSION
        http-only: true
        secure: true
        # Lax is required for the top-level authorization-code callback from ZITADEL.
        # CSRF and exact-Origin checks protect every same-origin mutation.
        same-site: lax
      tracking-modes: cookie

platform:
  retention:
    tombstone-key: ${RETENTION_TOMBSTONE_KEY:local-retention-tombstone-key-change-before-production}
    tombstone-registry-path: ${RETENTION_TOMBSTONE_PATH:./local/retention-tombstones}
    tombstone-registry-bucket: ${RETENTION_TOMBSTONE_BUCKET:local-retention-tombstones}
    quick-erasure-target: 24h
    live-erasure-deadline: 23d
    provider-evidence-deadline: 30d
    backup-expiry: 90d
    evidence-retention: 365d
    worker-batch-size: 100
    maximum-attempts: 10
    restore-replay-enabled: true
  offline-access:
    authorization-validity: 30d
    chunk-bytes: 1048576
    signing-private-key: ${OFFLINE_AUTHORIZATION_PRIVATE_KEY:}
    signing-public-key: ${OFFLINE_AUTHORIZATION_PUBLIC_KEY:}
  provider:
    google-cloud-project: ${GOOGLE_CLOUD_PROJECT:local-audiobook}
  generation:
    working-asset-path: ${AUDIO_WORKING_ASSET_PATH:${java.io.tmpdir}/folio-working/audio-generation}
    final-asset-path: ${AUDIO_FINAL_ASSET_PATH:${java.io.tmpdir}/folio-final/audiobooks}
    working-bucket: ${WORKING_BUCKET:local-working}
    final-bucket: ${FINALIZED_BUCKET:local-final}
    maximum-segment-characters: 3800
    ffmpeg-command: ${FFMPEG_COMMAND:ffmpeg}
    command-timeout: 2m
    sample-rate: 24000
    bitrate-kbps: 64
    target-lufs: -18.0
    true-peak-ceiling-dbtp: -1.5
    maximum-part-duration: 15m
    maximum-part-bytes: 10485760
    continuation-silence: 100ms
    paragraph-silence: 350ms
    structural-silence: 700ms
    chapter-silence: 1s
    working-asset-retention: 30d
  demonstration-subscription:
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:whsec_local_demonstration_only}
    monthly-price-id: ${STRIPE_DEMONSTRATION_MONTHLY_PRICE_ID:price_folio_demo_monthly}
    monthly-grant-characters: 500000
    signature-tolerance: 5m
    projector-enabled: ${STRIPE_PROJECTOR_ENABLED:true}
  narration:
    working-asset-path: ${NARRATION_WORKING_ASSET_PATH:${java.io.tmpdir}/folio-working/narration-plans}
    working-bucket: local-working
    pdf:
      page-batch-size: 8
      maximum-unreadable-pages: 5
      maximum-consecutive-unreadable-pages: 2
      maximum-rendered-pixels: 40000000
      command-timeout: 2m
      scratch-path: ${DOCUMENT_UNDERSTANDING_SCRATCH_PATH:${java.io.tmpdir}/folio-document-understanding}
      pdf-box-java-command: ${PDFBOX_JAVA_COMMAND:java}
      pdf-box-classpath: ${PDFBOX_CLASSPATH:/app/pdfbox-helper.jar}
      pdf-box-main-class: ${PDFBOX_MAIN_CLASS:dev.audiobook.pdfbox.PdfBoxBoundaryMain}
      maximum-pdf-box-heap-megabytes: ${PDFBOX_MAX_HEAP_MEGABYTES:384}
      python-command: ${DOCLING_PYTHON_COMMAND:python3}
      docling-script: ${DOCLING_SCRIPT:/app/bin/docling_extract.py}
      tesseract-command: ${TESSERACT_COMMAND:tesseract}
  admission:
    rights-terms-version: rights-v1
    rights-notice-version: notice-v1
    maximum-upload-bytes: 262144000
    upload-chunk-bytes: 8388608
    upload-session-validity: 15m
    quarantine-retention: 23d
    reserved-characters: 500000
    reserved-provider-cost-micros: 5000000
    provider: openai
    rate-card-version: preinspection-v1
    upload-token-secret: ${UPLOAD_TOKEN_SECRET:local-development-upload-capability-secret}
    quarantine-path: ${QUARANTINE_PATH:${java.io.tmpdir}/folio-quarantine}
    cloud-project-id: ${GOOGLE_CLOUD_PROJECT:local-audiobook}
    working-bucket: ${WORKING_BUCKET:local-working}
    work-topic: ${WORK_TOPIC:folio-local-work}
    push-audience: ${PUBSUB_PUSH_AUDIENCE:folio-local-inspection}
    push-service-account: ${PUBSUB_PUSH_SERVICE_ACCOUNT:local-inspection@local-audiobook.iam.gserviceaccount.com}
    inspection:
      maximum-input-bytes: 262144000
      maximum-pdf-pages: 2000
      maximum-epub-entries: 10000
      maximum-epub-expanded-bytes: 1073741824
      maximum-compression-ratio: 100
      maximum-xml-bytes: 26214400
      maximum-rendered-pixels: 40000000
      command-timeout: 30s
      runtime: 9m
      maximum-attempts: 3
      scratch-path: ${INSPECTION_SCRATCH_PATH:${java.io.tmpdir}/folio-inspection}
      malware-command: ${MALWARE_COMMAND:/usr/bin/clamscan}
      qpdf-command: ${QPDF_COMMAND:/usr/bin/qpdf}
  build:
    version: ${BUILD_VERSION:dev}
    revision: ${BUILD_REVISION:local}
  entitlement:
    free-grant-characters: 500000
    free-grant-validity: 365d
    per-conversion-character-ceiling: 500000
    per-conversion-spend-ceiling-micros: 5000000
    per-listener-spend-ceiling-micros: 10000000
    provider-spend-ceiling-micros: 100000000
    global-spend-ceiling-micros: 150000000
    per-listener-concurrency: 1
    global-concurrency: 3
  identity:
    allowed-origin: ${APPLICATION_ORIGIN:http://localhost:3000}
    broker-issuer: ${ZITADEL_ISSUER:https://login.eu.example}
    recovery-uri: ${ZITADEL_RECOVERY_URI:https://login.eu.example/ui/v2/login}
    broker-provider-ids:
      google: ${ZITADEL_GOOGLE_IDP_ID:google-local}
      apple: ${ZITADEL_APPLE_IDP_ID:apple-local}
      facebook: ${ZITADEL_FACEBOOK_IDP_ID:facebook-local}
    secure-session-cookie: true
    fresh-authentication-max-age: ${FRESH_AUTHENTICATION_MAX_AGE:5m}
    session-absolute-timeout: ${SESSION_ABSOLUTE_TIMEOUT:8h}
    session-rotation-interval: ${SESSION_ROTATION_INTERVAL:10m}
  trust-operations:
    delegated-access-maximum-duration: 24h
    emergency-access-maximum-duration: 30m
    emergency-review-deadline: 24h
    fresh-mfa-maximum-age: 5m

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  tracing:
    sampling:
      probability: ${TRACING_SAMPLE_RATE:0.1}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}

logging:
  pattern:
    level: "%5p trace_id=%X{traceId:-} span_id=%X{spanId:-}"
