spring:
  main:
    banner-mode: off
  datasource:
    hikari:
      connection-init-sql: SET search_path TO admission, workflow, public
  security:
    oauth2:
      client:
        registration:
          google:
            provider: zitadel
            client-id: folio-test
            client-secret: server-side-test-secret
            client-authentication-method: client_secret_basic
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: openid,profile,email
          apple:
            provider: zitadel
            client-id: folio-test
            client-secret: server-side-test-secret
            client-authentication-method: client_secret_basic
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: openid,profile,email
          facebook:
            provider: zitadel
            client-id: folio-test
            client-secret: server-side-test-secret
            client-authentication-method: client_secret_basic
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: openid,profile,email
        provider:
          zitadel:
            authorization-uri: https://login.eu.example/oauth/v2/authorize
            token-uri: https://login.eu.example/oauth/v2/token
            user-info-uri: https://login.eu.example/oidc/v1/userinfo
            jwk-set-uri: https://login.eu.example/oauth/v2/keys
            user-name-attribute: sub

server:
  servlet:
    session:
      cookie:
        secure: false

platform:
  demonstration-subscription:
    webhook-secret: whsec_test_webhook
    monthly-price-id: price_folio_demo_monthly
    monthly-grant-characters: 500000
    signature-tolerance: 5m
    projector-enabled: false
  narration:
    working-asset-path: ${java.io.tmpdir}/folio-working-tests/narration-plans
    working-bucket: local-working-test
  admission:
    rights-terms-version: rights-v1
    rights-notice-version: notice-v1
    maximum-upload-bytes: 262144000
    upload-chunk-bytes: 8388608
    upload-session-validity: 15m
    quarantine-retention: 23d
    reserved-characters: 500000
    reserved-provider-cost-micros: 1000000
    provider: openai
    rate-card-version: preinspection-v1
    upload-token-secret: test-only-upload-capability-secret
    quarantine-path: ${java.io.tmpdir}/folio-quarantine-tests
    inspection:
      maximum-input-bytes: 262144000
      maximum-pdf-pages: 2000
      maximum-epub-entries: 10000
      maximum-epub-expanded-bytes: 1073741824
      maximum-compression-ratio: 100
      maximum-xml-bytes: 26214400
      maximum-rendered-pixels: 40000000
      command-timeout: 30s
      runtime: 9m
      maximum-attempts: 3
      scratch-path: ${java.io.tmpdir}/folio-inspection-tests
      malware-command: /usr/bin/clamscan
      qpdf-command: /usr/bin/qpdf
  entitlement:
    free-grant-characters: 500000
    free-grant-validity: 365d
    per-conversion-character-ceiling: 500000
    per-conversion-spend-ceiling-micros: 5000000
    per-listener-spend-ceiling-micros: 10000000
    provider-spend-ceiling-micros: 100000000
    global-spend-ceiling-micros: 150000000
    per-listener-concurrency: 1
    global-concurrency: 3
  identity:
    allowed-origin: http://localhost:3000
    broker-issuer: https://login.eu.example
    recovery-uri: https://login.eu.example/ui/v2/login
    broker-provider-ids:
      google: google-idp
      apple: apple-idp
      facebook: facebook-idp
    secure-session-cookie: false
    fresh-authentication-max-age: 5m
    session-absolute-timeout: 8h
    session-rotation-interval: 10m

management:
  tracing:
    enabled: false
