spring:
  datasource:
    url: "jdbc:tc:postgresql:17.6-alpine:///audiobook?TC_INITSCRIPT=database/itest-init.sql&user=audiobook&password=integration-test-only"
    username: audiobook
    password: integration-test-only
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
  flyway:
    enabled: true
    default-schema: public
  security:
    oauth2:
      client:
        provider:
          zitadel:
            authorization-uri: http://localhost:29121/oauth/v2/authorize
            token-uri: http://localhost:29121/oauth/v2/token
            user-info-uri: http://localhost:29121/oidc/v1/userinfo
            jwk-set-uri: http://localhost:29121/oauth/v2/keys
  session:
    timeout: 8s

platform:
  offline-access:
    authorization-validity: 30d
    chunk-bytes: 4
  generation:
    ffmpeg-command: ${java.io.tmpdir}/folio-ffmpeg-itest/ffmpeg-container
  build:
    version: itest
    revision: test-revision
  demonstration-subscription:
    projector-enabled: true
  entitlement:
    per-conversion-spend-ceiling-micros: 1000000
    per-listener-spend-ceiling-micros: 2000000
    provider-spend-ceiling-micros: 3000000
    global-spend-ceiling-micros: 5000000
  identity:
    broker-issuer: http://localhost:29121
    fresh-authentication-max-age: 5s
    session-rotation-interval: 100ms

management:
  tracing:
    enabled: false
